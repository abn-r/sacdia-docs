name: Sync docs from source repos

# Regenera endpoints.mdx, schema-reference y versions desde los repos hermanos
# (sacdia-backend, sacdia-admin, sacdia-app). Abre un PR si hay drift.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * 1'  # cada lunes 06:00 UTC
  repository_dispatch:
    types: [sacdia-source-changed]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout sacdia-docs
        uses: actions/checkout@v4
        with:
          path: sacdia-docs
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout sacdia-backend
        uses: actions/checkout@v4
        with:
          repository: abn-r/sacdia-backend
          path: sacdia-backend
          token: ${{ secrets.SACDIA_REPO_TOKEN }}
          persist-credentials: false

      - name: Checkout sacdia-admin
        uses: actions/checkout@v4
        with:
          repository: abn-r/sacdia-admin
          path: sacdia-admin
          token: ${{ secrets.SACDIA_REPO_TOKEN }}
          persist-credentials: false

      - name: Checkout sacdia-app
        uses: actions/checkout@v4
        with:
          repository: abn-r/sacdia-app
          path: sacdia-app
          token: ${{ secrets.SACDIA_REPO_TOKEN }}
          persist-credentials: false

      # sacdia-backend declares engines.node ">=24 <25" (CI uses 24.13.1).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Install sacdia-docs deps
        working-directory: sacdia-docs
        run: pnpm install --frozen-lockfile

      # The generator boots the whole Nest AppModule, so ConfigModule validates
      # the env: every variable that env.validation.ts marks as required needs a
      # stub here (same set the backend e2e job uses). Add more if the backend
      # starts requiring new ones. Nothing connects to these hosts.
      #
      # Run it with ts-node (transpile-only), NOT tsx: tsx's CJS tsconfig-paths
      # resolver (backend tsconfig sets baseUrl) crashes with
      # ERR_INVALID_URL_SCHEME on the ESM-only `p-limit@5` dependency, whose
      # `#async_hooks` import map points at a `node:` builtin. Native Node
      # require(esm) resolves it fine.
      - name: Generate OpenAPI spec from backend
        working-directory: sacdia-backend
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec prisma generate
          pnpm exec ts-node --transpile-only scripts/generate-openapi.ts
          test -s sacdia-api-spec.json
        env:
          DATABASE_URL: postgres://stub:stub@localhost:5432/stub
          BETTER_AUTH_SECRET: stub-secret-for-spec-generation-only
          QR_JWT_SECRET: stub-qr-secret-for-spec-generation-ok
          EMAIL_ENABLED: 'false'
          RESEND_API_KEY: re_stub_key_for_spec_generation
          RESEND_FROM_EMAIL: 'SACDIA <stub@example.invalid>'
          R2_BUCKET_HONORS_PDF: stub
          R2_PUBLIC_URL_HONORS_PDF: https://r2.invalid
          R2_BUCKET_EVIDENCE_FILES: stub
          R2_PUBLIC_URL_EVIDENCE_FILES: https://r2.invalid
          R2_BUCKET_INSURANCE_EVIDENCE: stub
          R2_PUBLIC_URL_INSURANCE_EVIDENCE: https://r2.invalid
          R2_BUCKET_DATA_EXPORTS: stub
          R2_PUBLIC_URL_DATA_EXPORTS: https://r2.invalid
          R2_BUCKET_MONTHLY_REPORTS: stub
          R2_PUBLIC_URL_MONTHLY_REPORTS: https://r2.invalid
          R2_BUCKET_RESOURCES_FILES: stub
          R2_PUBLIC_URL_RESOURCES_FILES: https://r2.invalid

      - name: Run sync scripts
        working-directory: sacdia-docs
        run: pnpm sync:all

      - name: Detect drift
        id: drift
        working-directory: sacdia-docs
        run: |
          generated_root="apps/tecnico/src/content/docs"
          if [[ -n "$(git status --porcelain "$generated_root")" ]]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            git status --short "$generated_root"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR with drift
        if: steps.drift.outputs.drift == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          path: sacdia-docs
          commit-message: 'docs: sync generated artifacts from source repos'
          title: 'docs: sync generated artifacts'
          body: |
            Auto-generated PR from `sync-docs.yml`.

            Updated files:
            - `apps/tecnico/src/content/docs/api/endpoints.mdx` (from OpenAPI spec)
            - `apps/tecnico/src/content/docs/base-de-datos/schema-reference/_generated-models.mdx` (from Prisma schema)
            - `apps/tecnico/src/content/docs/estandares/stack-tecnologico/_generated-versions.mdx` (from package.json + pubspec.yaml)

            Source repos:
            - `abn-r/sacdia-backend`
            - `abn-r/sacdia-admin`
            - `abn-r/sacdia-app`
          branch: docs/auto-sync
          delete-branch: true
