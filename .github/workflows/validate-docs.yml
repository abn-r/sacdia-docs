name: Validate documentation portals

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - '.pages.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vitest.config.mts'
      - '.github/workflows/validate-docs.yml'
  push:
    branches: [development]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.29.3'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit and contract tests
        run: pnpm test
      - name: Check Astro projects
        run: pnpm check
